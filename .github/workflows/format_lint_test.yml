name: Format, Lint & Test
on:
    push:
        branches:
            - development
            - main
    pull_request:
        types:
            - opened
            - reopened
            - synchronize

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    ts-lint:
        name: Format, Lint & Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Format
              run: npm run format:check
            - name: Lint
              run: npm run lint
            - name: Test
              run: npm run test
